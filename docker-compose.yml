version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillforge_lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillforge_lms"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./lms-backend
      dockerfile: Dockerfile
    container_name: skillforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/skillforge_lms
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: ${JWT_SECRET:-SuperSecretProductionKeyMustBeAtLeast256BitsLong1234567890}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      APP_BASE_URL: http://localhost:5173
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@skillforge.com}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-AdminSecure2026!}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/data/uploads

  frontend:
    build:
      context: ./lms-frontend
      dockerfile: Dockerfile
    container_name: skillforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  backend-uploads:
